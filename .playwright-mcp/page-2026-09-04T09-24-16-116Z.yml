gns up through your link gives you bonus entries. So, the more you share, the more chances you have to win. What makes Win5 different from every other giveaway? Transparency. That's the core of everything we're building. Most giveaways are impossible to verify. You just have to trust the organizer, and that trust is usually misplaced. With Win5, we're building towards a system where every draw is recorded on the Solana blockchain so that anyone can verify the results at any time. No trust required. Just look it up. We don't sell your email. We don't share your data. We don't make you complete a bunch of tasks before you can enter. The giveaway is free, the entry is simple, and the draw is transparent. The prize comes out of our own pocket right now. We fund it through affiliate partnerships and ads on the site. You'll see a Freecash banner on the homepage, and that's how we keep it running. You're never asked to pay for anything. Available worldwide, in 22 languages Win5 works everywhere. We have users from Korea, Vietnam, Ukraine, Brazil, Indonesia, and dozens of other countries. The site is translated into 22 languages including English, Spanish, French, Portuguese, Thai, Chinese, Japanese, Korean, Vietnamese, Arabic, Hindi, Russian, Turkish, Bengali, and more. Whether you're in Lagos or London, Tokyo or Taipei, you can enter the giveaway and win. The $5 USDT prize works globally because it's crypto. No bank account needed, no geographic restrictions, no PayPal limitations. The bigger picture Win5 is the first product from WinLab. But it's not the last. We're building a directory of all the legitimate ways to win and earn money online, so people can find real opportunities instead of falling for scams. We're also working towards bigger giveaways with bigger prizes as the community grows. And most importantly, we want to open-source our entire draw system so that anyone can audit it, verify it, and use it to run their own transparent giveaway. The ultimate goal is 